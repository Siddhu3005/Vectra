services:
  mysqldb:
    image: mysql:8.0
    container_name: vectra-mysql
    restart: always
    environment:
      MYSQL_DATABASE: vectra_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vectra-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://mysqldb:3306/vectra_db?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - JWT_SECRET=VectraEnterpriseJwtSecretKeyMustBeAtLeast32BytesLong2026
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost,http://localhost:80
    depends_on:
      mysqldb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api
    container_name: vectra-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
